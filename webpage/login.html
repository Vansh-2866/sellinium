
<!DOCTYPE html>
<html>
<head>
    <title>Local Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 50px;
        }

        .login-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        #message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Page</h2>

        <form id="loginForm">

            <input type="text"
                   id="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   id="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let username =
                    document.getElementById("username").value;

                let password =
                    document.getElementById("password").value;

                if (username === "admin" &&
                    password === "12345") {

                    document.getElementById("message").innerText =
                        "Login Successful!";

                } else {

                    document.getElementById("message").innerText =
                        "Invalid Username or Password!";
                }
            });
    </script>

</body>
</html>
